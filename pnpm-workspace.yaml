# Newly resolved releases wait a week so compromise reports can surface.
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  # Approved waiver, dsh-plannotator only: exact versions of harness 0.2.2-rc.5, the
  # registry's latest. Remove on or after
  # 2026-11-25 12:54 UTC, when the youngest entry
  # (@deepseek-ai/dsh-llm@0.2.2-rc.5, published 2026-11-18 12:53 UTC) leaves the window.
  - '@deepseek-ai/dsh-agent@0.2.2-rc.5'
  - '@deepseek-ai/dsh-attachment@0.2.2-rc.5'
  - '@deepseek-ai/dsh-brand@0.2.2-rc.5'
  - '@deepseek-ai/dsh-commands@0.2.2-rc.5'
  - '@deepseek-ai/dsh-error@0.2.2-rc.5'
  - '@deepseek-ai/dsh-llm@0.2.2-rc.5'
  - '@deepseek-ai/dsh-scope@0.2.2-rc.5'
  - '@deepseek-ai/dsh-session-projection@0.2.2-rc.5'
  - '@deepseek-ai/dsh-session@0.2.2-rc.5'
  - '@deepseek-ai/dsh-system-prompt@0.2.2-rc.5'
  - '@deepseek-ai/dsh-timeout@0.2.2-rc.5'
  - '@deepseek-ai/dsh-typert-protocol@0.2.2-rc.5'
  - '@deepseek-ai/dsh-util-crypto@0.2.2-rc.5'
  - '@deepseek-ai/dsh-util-values@0.2.2-rc.5'

# Only reviewed packages may run install or build scripts: exact names, no
# globs. Any package with a build script that is not listed fails the install
# (strictDepBuilds) instead of being skipped silently.
allowBuilds:
  # The PTY dogfood harness needs node-pty's native addon (node-pty is pinned
  # to an exact version in package.json).
  node-pty: true
  # Reviewed and denied: the tests do not need their install scripts.
  '@deepseek-ai/dsh-subprocess-local': false
  '@google/genai': false
  esbuild: false
  koffi: false
  protobufjs: false
strictDepBuilds: true

# Security floors for transitive dependencies the harness pulls in. Each entry
# only matches the vulnerable range, so a harness release that already ships the
# fix resolves untouched and the entry can be dropped then.
#   GHSA-mrhx-c7xc-m3w5  zod (the harness pins 4.4.3 exactly)
overrides:
  'zod@>=4.0.0 <4.6.6': ^4.6.7
