# Supply-chain policy for this repository.
# Newly resolved releases stay out for their first week (minutes). The only
# exceptions are the exact versions a verified harness release ships, because
# the matrix bump has to test the release the registry serves as latest
# (RELEASE.md). Each entry names one version, never a publisher, and is dropped
# once nothing resolves it.
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  # Harness 0.2.1-rc.2 and the framework releases it pins. pnpm verifies each
  # lockfile entry against the window even on a frozen install, so the list is
  # needed until these mature. Remove it after 2026-10-24 08:22 UTC, when the
  # youngest entry (published 2026-10-17 08:21 UTC) leaves the window.
  - '@deepseek-ai/cordis@4.0.5'
  - '@deepseek-ai/cosmokit@1.8.6'
  - '@deepseek-ai/schemastery@3.18.5'
  - '@deepseek-ai/dsh-agent@0.2.1-rc.2'
  - '@deepseek-ai/dsh-attachment@0.2.1-rc.2'
  - '@deepseek-ai/dsh-brand@0.2.1-rc.2'
  - '@deepseek-ai/dsh-commands@0.2.1-rc.2'
  - '@deepseek-ai/dsh-llm@0.2.1-rc.2'
  - '@deepseek-ai/dsh-scope@0.2.1-rc.2'
  - '@deepseek-ai/dsh-session@0.2.1-rc.2'
  - '@deepseek-ai/dsh-session-projection@0.2.1-rc.2'
  - '@deepseek-ai/dsh-system-prompt@0.2.1-rc.2'
  - '@deepseek-ai/dsh-timeout@0.2.1-rc.2'
  - '@deepseek-ai/dsh-typert-protocol@0.2.1-rc.2'
  - '@deepseek-ai/dsh-util-crypto@0.2.1-rc.2'
  - '@deepseek-ai/dsh-util-values@0.2.1-rc.2'

# Only reviewed packages may run install or build scripts: exact names, no
# globs. Any package with a build script that is not listed fails the install
# (strictDepBuilds) instead of being skipped silently.
allowBuilds:
  # The PTY dogfood harness needs node-pty's native addon (node-pty is pinned
  # to an exact version in package.json).
  node-pty: true
  # Reviewed and denied: the tests do not need their install scripts.
  '@deepseek-ai/dsh-subprocess-local': false
  '@google/genai': false
  esbuild: false
  koffi: false
  protobufjs: false
strictDepBuilds: true

# Security floors for transitive dependencies the harness pulls in. Each entry
# only matches the vulnerable range, so a harness release that already ships the
# fix resolves untouched and the entry can be dropped then.
#   GHSA-mrhx-c7xc-m3w5  zod (the harness pins 4.4.3 exactly)
overrides:
  'zod@>=4.0.0 <4.6.6': ^4.6.7
