name: harness-matrix

# The matrix is checked offline in verify; this run is the registry half. A
# harness release that moves past dsh.compatibility.dshReleases fails here on
# schedule, so the bump RELEASE.md owns happens before a release needs it.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '24.20.0'

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Harness release drift
        run: node tools/harness-matrix.mjs --check-registry
